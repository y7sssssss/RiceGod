services:
  app:
    build:
      context: .
    env_file:
      - .env
    environment:
      NEO4J_URI: bolt://neo4j:7687
      MILVUS_HOST: milvus
      POSTGRES_HOST: postgres
    ports:
      - "8000:8000"
    depends_on:
      neo4j:
        condition: service_healthy
      postgres:
        condition: service_healthy
      milvus:
        condition: service_started
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    restart: unless-stopped

  neo4j:
    image: neo4j:5.26-community
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      AUTH_USER: ${NEO4J_USER:-neo4j}
      AUTH_PASSWORD: ${NEO4J_PASSWORD:?Set NEO4J_PASSWORD in .env}
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:?Set NEO4J_PASSWORD in .env}
      NEO4J_PLUGINS: '["apoc"]'
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - ./data/neo4j_csv:/var/lib/neo4j/import
    healthcheck:
      test:
        - CMD-SHELL
        - 'cypher-shell -u "$${AUTH_USER:-neo4j}" -p "$${AUTH_PASSWORD}" "RETURN 1" >/dev/null 2>&1'
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  postgres:
    image: pgvector/pgvector:pg16
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ricegod}
      POSTGRES_USER: ${POSTGRES_USER:-ricegod}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 15

  etcd:
    image: quay.io/coreos/etcd:v3.5.5
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    volumes:
      - etcd_data:/etcd
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd

  minio:
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/minio_data
    command: minio server /minio_data --console-address ":9001"

  milvus:
    image: milvusdb/milvus:v2.3.3
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    volumes:
      - milvus_data:/var/lib/milvus
    ports:
      - "19530:19530"
      - "9091:9091"
    depends_on:
      - etcd
      - minio

  recipe-init:
    build:
      context: .
    profiles: ["init"]
    env_file:
      - .env
    environment:
      NEO4J_URI: bolt://neo4j:7687
    entrypoint: ["python", "-m", "scripts.import_recipes_to_neo4j"]
    depends_on:
      neo4j:
        condition: service_healthy

  knowledge-init:
    build:
      context: .
    profiles: ["init"]
    env_file:
      - .env
    environment:
      MILVUS_HOST: milvus
    entrypoint: ["python", "-m", "scripts.ingest_food_knowledge_to_milvus"]
    depends_on:
      milvus:
        condition: service_started

volumes:
  neo4j_data:
  neo4j_logs:
  postgres_data:
  etcd_data:
  minio_data:
  milvus_data:
