[build-system]
requires = ["setuptools>=75,<76"]
build-backend = "setuptools.build_meta"

[project]
name = "ricegod"
version = "1.0.0"
description = "A LangGraph recipe assistant with GraphRAG, vector retrieval, and auditable long-term memory."
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = { file = "LICENSE" }
authors = [{ name = "RiceGod contributors" }]
dependencies = [
  "fastapi==0.141.1",
  "uvicorn[standard]==0.53.0",
  "langchain-core==1.6.3",
  "langchain-openai==1.6.2",
  "langgraph==1.2.11",
  "langgraph-checkpoint-postgres==3.1.2",
  "langchain-text-splitters==1.1.2",
  "neo4j==6.3.1",
  "openai==3.14.1",
  "pydantic==2.13.5",
  "pydantic-settings==2.15.0",
  "psycopg[binary,pool]==3.3.5",
  "pgvector==0.5.0",
  "pymilvus==2.3.8",
  "marshmallow==3.26.2",
  "python-dotenv==1.2.3",
]

[project.optional-dependencies]
dev = [
  "pytest==9.1.1",
  "httpx==0.28.1",
  "flake8==7.0.0",
]

[tool.setuptools.packages.find]
include = ["ricegod*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
