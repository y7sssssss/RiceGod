name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: ricegod
          POSTGRES_USER: ricegod
          POSTGRES_PASSWORD: test-postgres-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ricegod -d ricegod"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15

    env:
      CHECKPOINT_BACKEND: memory
      RERANK_MODEL: test-rerank
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ricegod
      POSTGRES_USER: ricegod
      POSTGRES_PASSWORD: test-postgres-password
      RICEGOD_TEST_POSTGRES: "1"
      LANGGRAPH_STRICT_MSGPACK: "true"
      LANGSMITH_TRACING: "false"
      LANGCHAIN_TRACING_V2: "false"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install --requirement requirements-dev.txt

      - name: Check syntax and undefined names
        run: python -m flake8 ricegod scripts tests

      - name: Run unit and PostgreSQL integration tests
        run: python -m pytest tests -q -p no:cacheprovider
